<!DOCTYPE html>
<html data-identity="signature" lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="theme-color" content="#fff">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Fund Edition · 产品导览</title>
  <link rel="icon" href="/assets/signature-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="judges.css">
<link rel="stylesheet" href="/room-primitives.css">
  <script defer src="judge-records.js"></script>
  <script defer src="judges.js"></script>
  <link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="/portfolio-wallet.css"><script type="module" src="/portfolio-header.mjs"></script></head>
<body>
  <header class="mast"><span class="brand"><img aria-hidden="true" alt="" src="/assets/signature-mark.svg" width="26" height="26"><span data-brand-text>Fund Edition</span></span><a class="wallet-nav" data-portfolio-nav href="/portfolio?lang=zh-CN">我的投资组合</a><button type="button" id="locale" aria-label="Switch to English">English</button></header>
  <main id="tour" aria-label="产品导览">
    <div id="visual" class="visual"><div class="visual-content" id="visual-content"></div></div>
    <section class="transcript"><p class="eyeline" id="context"></p><h1 id="title" tabindex="-1"></h1><p id="copy" class="copy"></p>
      <div class="actions" id="actions"></div><div class="navigation"><button type="button" id="prev"></button><span id="counter"></span><button type="button" id="next"></button></div>
      <div class="timeline" aria-hidden="true"><i id="progress"></i></div></section>
  </main>
  <dialog id="source" aria-labelledby="source-title"><section><h2 id="source-title"></h2><div id="source-body"></div><button id="close" type="button"></button></section></dialog>
  <noscript>请启用 JavaScript 播放本地导览。 Enable JavaScript to open the local tour.</noscript>
</body></html>
